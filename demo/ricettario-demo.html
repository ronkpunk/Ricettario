<style>
/* Material 3 · palette calda "agrumi e pomodoro" */

  --on-surface: #f2dfd6; --on-surface-v: #d9c1b7; --outline: #a18d83; --outline-v: #54433c;

  --primary: #ffb4a1; --on-primary: #5f1500; --primary-c: #862200; --on-primary-c: #ffdad1;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.pn a small { display: block; color: var(--on-surface-v); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Navigation bar ---------- */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: space-around; height: calc(var(--nav-h) + var(--safe-b)); padding: 12px max(8px, env(safe-area-inset-right, 0px)) var(--safe-b) max(8px, env(safe-area-inset-left, 0px)); background: var(--surface-2); }

/* ---------- Form editor ---------- */

.snack { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 24px); transform: translateX(-50%); z-index: 80; max-width: min(92vw, 520px); padding: 14px 20px; border-radius: 12px; background: var(--on-surface); color: var(--surface); box-shadow: var(--shadow-2); font-size: .9rem; animation: rise .2s both; }

/* ---------- Modalità focus ---------- */
.focus { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--surface); padding-top: env(safe-area-inset-top, 0px); }
.focus-bar { display: flex; align-items: center; gap: 2px; padding: 4px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }

<script>
const DATA = {"categories":[{"id":"dolci","name":"Dolci","emoji":"🍰","color":"#ff6b81"},{"id":"lievitati","name":"Lievitati","emoji":"🥐","color":"#ffa94d"},{"id":"colazione","name":"Colazione e merenda","emoji":"🥞","color":"#ffd43b"},{"id":"primi","name":"Primi","emoji":"🍝","color":"#ff8787"},{"id":"secondi","name":"Secondi","emoji":"🍗","color":"#69db7c"},{"id":"contorni","name":"Contorni","emoji":"🫑","color":"#38d9a9"},{"id":"basi","name":"Basi e preparazioni","emoji":"🥣","color":"#74c0fc"}],"recipes":[{"id":"01-torta-di-amaretti","num":1,"title":"Torta di amaretti","subtitle":null,"cat":"dolci","emoji":"🥧","servings":8,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":250,"u":"g","n":"amaretti","di":true},{"q":200,"u":"g","n":"burro","di":true},{"q":250,"u":"g","n":"zucchero","di":true},{"q":300,"u":"g","n":"fecola","di":true},{"q":6,"n":"uova"},{"q":1,"u":"bustina","n":"lievito"},{"q":1,"u":"rotolo","n":"pasta sfoglia"},{"n":"Vanillina"},{"n":"Liquore","note":"Disaronno o essenza"}]}],"steps":[{"title":null,"items":["Lavorare il burro con lo zucchero poi aggiungere i tuorli, gli amaretti tritati fini, la fecola e il lievito. Montare gli albumi a neve ferma e aggiungerli mescolando piano dal basso verso l’alto.","Foderare uno stampo a bordi alti con carta da forno e appoggiarvi la pasta sfoglia. Riempire con l’impasto e rivoltarvi sopra il bordo della pasta sfoglia, che sarà poi spennellato di latte.","Cuocere a 180° per un’ora circa: è pronta quando, controllando con uno stuzzicadenti, l’interno dell’impasto è asciutto."]}]},{"id":"02-torta-di-rose-1-rosanna","num":2,"title":"Torta di rose 1 (Rosanna)","subtitle":null,"cat":"lievitati","emoji":"🌹","servings":8,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":"Impasto","items":[{"q":750,"u":"g","n":"farina","di":true,"note":"500 g in inverno"},{"q":90,"u":"g","n":"zucchero","di":true},{"q":2,"n":"uova"},{"q":60,"u":"g","n":"burro morbido","di":true},{"q":25,"u":"g","n":"lievito di birra fresco","di":true,"note":"7 g se secco"},{"q":1,"u":"tazza","n":"latte"},{"q":1,"u":"bustina","n":"vanillina"},{"q":0.5,"n":"limone grattugiato"},{"q":0.5,"u":"cucchiaino","n":"sale"}]},{"title":"Farcitura","items":[{"q":40,"u":"g","n":"zucchero","di":true,"note":"di canna, a velo e cannella"},{"q":40,"u":"g","n":"burro morbido","di":true}]}],"steps":[{"title":null,"items":["Per aumentare l’elasticità si può iniziare con il roux: 3 cucchiai di farina e una tazza di latte caldo, mescolando in continuazione, cuocere a fuoco lento evitando la formazione di grumi, eventualmente aggiungere latte. Coprire con una pellicola e lasciar riposare un paio d’ore in frigorifero, meglio tutta la notte.","In una terrina media mettere tre cucchiai di farina, un cucchiaino di zucchero, il lievito e mescolare, continuando a mescolare aggiungere a filo un bicchiere di latte tiepido; lasciar lievitare per circa ½ ora, quando si è alzato mescolare e lasciar lievitare ancora poi iniziare l’impasto.","Mettere farina, zucchero, limone grattugiato e iniziare a mescolare, aggiungere il roux se è stato fatto e le uova (NON il burro), impastare veloce per 10’. Ammorbidire il burro e aggiungerlo poco per volta, mescolando veloce fino ad ottenere un impasto poco appiccicoso, se necessario aggiungere uno o due cucchiai di farina.","Mettere a lievitare al coperto, in una busta di plastica, in base alla temperatura posso bastare 2 o 3 ore, in inverno anche 4. Quando ha lievitato (raddoppiato il volume) tagliare in due e tirare delle sfoglie tonde alte mezzo centimetro.","Sciogliere un po’ di margarina (o burro) per ungere lo stampo e la pasta, su cui va spolverato un po’ di zucchero. Arrotolare e tagliare a pezzi da 4/5 cm che vanno disposti sullo stampo distanti tra loro, mettere le estremità al centro. Mettere le teglie in una busta di plastica e lasciar lievitare per altre 2 o 3 ore, finché non si sono gonfiate.","Cospargere di burro e zucchero (va bene anche quello di canna eventualmente con aggiunta di cannella), nella parte alta si può spalmare una gelatina di zucchero a velo e poca acqua. Mettere in forno preriscaldato a 200°, su una griglia nella parte bassa; cuocere per circa 20 minuti, fino a quando hanno una bella doratura."]}]},{"id":"03-krapfen","num":3,"title":"Krapfen","subtitle":null,"cat":"colazione","emoji":"🍩","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":"La quantità di farina non era indicata: regolala a occhio fino a ottenere una pasta morbida, e controlla tempi e cottura.","link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":50,"u":"g","n":"lievito di birra","di":true},{"q":7,"n":"uova"},{"q":150,"u":"g","n":"zucchero","di":true},{"q":120,"u":"g","n":"burro","di":true},{"n":"Farina q.b.","note":"quantità non indicata"},{"n":"Acqua tiepida q.b."},{"n":"Un pizzico sale"}]}],"steps":[{"title":null,"items":["Sciogliere il lievito nell’acqua tiepida, aggiungere un cucchiaino di zucchero e 2-3 cucchiai di farina fino ad ottenere una cremina; coprire e lasciar lievitare per mezz’ora in un luogo tiepido, fino a quando diventa spumoso.","Aggiungere le uova, il burro fuso e sbattere bene, aggiungendo poi lo zucchero e la farina, mescolando per ottenere una pasta morbida. Aggiungere il sale, lasciando poi riposare per circa 2 ore coprendo e in un posto tiepido.","Stendere l’impasto, ritagliare i krapfen, adagiarli in una teglia e lasciar riposare per un’altra mezz’ora.","Infornare in forno preriscaldato a 200° e cuocere per mezz’ora."]}]},{"id":"04-chiacchere-e-favin","num":4,"title":"Chiacchere e Favin","subtitle":null,"cat":"dolci","emoji":"🎉","servings":4,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":{"url":"https://www.youtube.com/watch?v=l41-DjQLBhc&t=2s","label":"Guarda il video"},"tips":[],"ingredients":[{"title":"Chiacchere (per 4 persone)","items":[{"q":500,"u":"g","n":"farina","di":true},{"q":4,"n":"uova"},{"q":100,"u":"g","n":"zucchero","di":true},{"q":1,"u":"pezzetto","n":"burro","note":"o un cucchiaio di olio di arachide"},{"q":3,"u":"cucchiai","n":"grappa","note":"rum, cognac o anice"},{"q":1,"u":"bustina","n":"vanillina"},{"q":1,"n":"limone grattugiato"}]},{"title":"Favin (per 4 persone)","items":[{"q":350,"u":"g","n":"farina","di":true},{"q":2,"n":"uova"},{"q":110,"u":"g","n":"zucchero","di":true},{"q":1,"u":"sorso","n":"cognac","note":"grappa o anice"},{"q":1,"u":"bustina","n":"lievito"},{"q":1,"n":"limone grattugiato"},{"q":1,"n":"pizzico sale"}]}],"steps":[{"title":"Chiacchere","items":["Sbattere le uova con la scorza di limone, zucchero, grappa poi mettere nell’impastatrice con metà farina e la vanillina. Continuare ad impastare con il resto della farina e il cucchiaio di olio, alla fine impastare duro a mano aggiungendo farina se necessario. Lasciare riposare in frigo per un paio d’ore e tirare sottile, la pasta deve essere quasi trasparente.","Tagliare dei rettangoli da 5 x 10 cm, fare due incisioni all’interno (senza tagliare), prendere una striscia e inserirla nell’altra (o agitarla con un bastoncino) e friggere con strutto (olio di semi) per pochi secondi."]},{"title":"Favin","items":["Sbattere le uova con la scorza di limone, lo zucchero, il cognac e il sale, poi unire la farina e il lievito e impastare fino a ottenere un impasto sodo, aggiungendo farina se necessario. Lasciare riposare in frigo per un paio d’ore.","Fare un rotolino da circa 2 cm e tagliare ogni 2 cm ruotando l’impasto ogni volta. Friggere con strutto (olio di semi) per pochi secondi."]}]},{"id":"05-pan-dei-morti","num":5,"title":"Pan dei morti","subtitle":null,"cat":"dolci","emoji":"🍪","servings":10,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":500,"u":"g","n":"farina","di":true},{"q":500,"u":"g","n":"zucchero","di":true},{"q":100,"u":"g","n":"cacao","di":true},{"q":250,"u":"ml","n":"vino nero","di":true},{"n":"Droghe q.b."},{"n":"Uvetta q.b."},{"n":"Lievito q.b."},{"n":"Pinoli q.b."},{"n":"Zucchero a velo q.b."}]}],"steps":[{"title":null,"items":["Scaldare il vino, mettere lo zucchero, poi cacao, uvetta e le droghe. Impastare sul marmo con la farina, aggiungere lo lievito. Ungersi le mani e fare delle formine mettendo i pinoli.","Cuocere a temperatura moderata per 15 minuti e poi cospargere di zucchero a velo."]}]},{"id":"06-pasta-per-strudel","num":6,"title":"Pasta per strudel","subtitle":null,"cat":"basi","emoji":"🥨","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":2,"n":"uova intere"},{"q":1,"u":"cucchiaio","n":"zucchero"},{"q":1,"u":"noce","n":"burro"},{"q":1,"u":"cucchiaino","n":"aceto"},{"n":"Sale"},{"n":"Farina q.b."}]}],"steps":[{"title":null,"items":["Impastare, lasciar riposare e tirare molto sottile, aggiungendo acqua se troppo dura."]}]},{"id":"07-panpepato","num":7,"title":"Panpepato","subtitle":null,"cat":"dolci","emoji":"🍫","servings":20,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":1,"u":"kg","n":"farina","di":true},{"q":1,"u":"kg","n":"zucchero","di":true},{"q":200,"u":"g","n":"cacao puro","di":true},{"q":500,"u":"g","n":"mandorle","di":true},{"q":200,"u":"g","n":"pinoli","di":true},{"q":300,"u":"g","n":"cedrini","di":true},{"q":25,"u":"g","n":"droghe","di":true},{"q":500,"u":"ml","n":"vino nero","di":true},{"n":"Cioccolato per copertura"},{"q":2,"u":"bustine","n":"lievito"}]}],"steps":[{"title":null,"items":["Scaldare il vino, aggiungere lo zucchero, cacao e cioccolato.","Quando è tutto amalgamato togliere dal fuoco e impastare con la farina e gli altri ingredienti. Deve risultare molto duro.","Ungersi le mani e formare delle cupole da 10-15 cm.","Mettere distanziati 3-4 cm su carta da forno, cuocere a fuoco moderato per 45 minuti.","Lasciar stagionare 15-20 giorni in sacchetti di plastica chiusi all’esterno."]}]},{"id":"08-ciambella","num":8,"title":"Ciambella","subtitle":null,"cat":"dolci","emoji":"🍩","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":4,"n":"uova"},{"q":100,"u":"g","n":"burro","di":true},{"q":200,"u":"g","n":"zucchero","di":true},{"q":200,"u":"g","n":"farina","di":true},{"q":0.5,"u":"bicchiere","n":"latte"},{"q":1,"n":"limone grattugiato"},{"q":1,"u":"bustina","n":"lievito"}]}],"steps":[{"title":null,"items":["Ammorbidire il burro e lavorarlo con i tuorli e lo zucchero, aggiungere farina, latte, lievito e limone, alla fine gli albumi montati a neve."]}]},{"id":"09-pasta-frolla","num":9,"title":"Pasta frolla","subtitle":null,"cat":"basi","emoji":"🍪","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":"Versione base","items":[{"q":2,"n":"uova","note":"solo tuorli"},{"q":200,"u":"g","n":"burro","di":true},{"q":200,"u":"g","n":"zucchero","di":true},{"q":400,"u":"g","n":"farina","di":true}]},{"title":"Alternativa","items":[{"q":2,"n":"uova","note":"solo tuorli"},{"q":1,"n":"uovo"},{"q":200,"u":"g","n":"burro","di":true},{"q":100,"u":"g","n":"zucchero","di":true},{"q":300,"u":"g","n":"farina","di":true},{"q":1,"u":"bustina","n":"vanillina"},{"q":1,"u":"bicchierino","n":"liquore"}]}],"steps":[{"title":null,"items":["Procedimento non annotato nel ricettario."]}]},{"id":"10-pesche-ripiene","num":10,"title":"Pesche ripiene","subtitle":null,"cat":"dolci","emoji":"🍑","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":1,"u":"sacchetto","n":"amaretti"},{"q":3,"u":"cucchiai","n":"zucchero"},{"q":1,"q2":2,"n":"uova"},{"q":10,"q2":12,"n":"pesche"}]}],"steps":[{"title":null,"items":["Preparare il ripieno frantumando gli amaretti e mescolandoli con lo zucchero e le uova.","Mettere sul fondo della pentola vino bianco o marsala, poi le pesche scavate e riempite con il ripieno.","Infornare a caldo.","Servire con zabaione."]}]},{"id":"11-pasta-e-ceci","num":11,"title":"Pasta e ceci","subtitle":null,"cat":"primi","emoji":"🍲","servings":6,"servingsLabel":"persone","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":0.5,"u":"kg","n":"ceci","di":true},{"q":1,"u":"spicchio","n":"aglio"},{"q":4,"u":"cucchiai","n":"olio"},{"q":200,"u":"g","n":"lardo","di":true},{"n":"Prezzemolo"},{"q":1,"n":"dado"}]}],"steps":[{"title":null,"items":["Mettere a bagno i ceci in acqua tiepida e bicarbonato per una notte, al mattino lessarli in due litri d’acqua.","A parte soffriggere olio, aglio, prezzemolo e lardo, versare il soffritto nella pentola dei ceci.","A fine cottura aggiungere il dado, salare e pepare, quando bolle aggiungere la pasta."]}]},{"id":"12-gnocchi-alla-romana","num":12,"title":"Gnocchi alla romana","subtitle":null,"cat":"primi","emoji":"🥘","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":1,"u":"l","n":"latte","di":true},{"q":250,"u":"g","n":"semolino di grano","di":true},{"q":50,"u":"g","n":"burro","di":true},{"q":2,"n":"uova intere"},{"q":100,"u":"g","n":"formaggio grattugiato","di":true},{"n":"Noce moscata"},{"n":"Sale"},{"n":"Pepe"}]}],"steps":[{"title":null,"items":["Scaldare il latte con la noce moscata, sale e pepe. Quando inizia a bollire aggiungere il semolino a pioggia mescolando con la frusta, cuocere mescolando per pochi minuti.","Togliere dal fuoco e unire le uova, il burro e il formaggio grattugiato impastando a mano.","Versare sul tavolo bagnato, stendere a 1 – 1,5 cm di altezza, tagliare a tondini continuando a riutilizzare lo scarto. Man mano disporre nella pentola leggermente sovrapposti e aggiungere qualche fiocchetto di burro e parmigiano.","Cuocere a forno ben caldo."]}]},{"id":"13-budino-mantovano","num":13,"title":"Budino mantovano","subtitle":null,"cat":"dolci","emoji":"🍮","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":100,"u":"g","n":"burro","di":true},{"q":100,"u":"g","n":"farina","di":true},{"q":100,"u":"g","n":"zucchero","di":true},{"q":100,"u":"g","n":"cacao amaro","di":true},{"q":1,"u":"l","n":"latte","di":true},{"n":"Vaniglia"},{"n":"Un pizzico Suk"},{"q":0.5,"n":"tavoletta cioccolato"}]}],"steps":[{"title":null,"items":["Scaldare il latte a parte con una scorza di limone.","Sciogliere il burro in una pentola dove poter mettere tutti gli ingredienti, aggiungere lentamente la farina spolverandola e, sempre mescolando con la frusta, lasciare cuocere per ad ottenere una leggera tostatura.","Aggiungere il latte preriscaldato a filo, sempre mescolando per evitare i grumi, vaniglia, Suk e lo zucchero, alla fine il cacao spolverato e il cioccolato."]},{"title":"Variante Zina","items":["Scaldare il latte a parte con una scorza di limone.","Sciogliere il burro in una pentola dove poter mettere tutti gli ingredienti, aggiungere lentamente la farina spolverandola e, sempre mescolando con la frusta, lasciare cuocere fino ad ottenere una leggera tostatura.","Aggiungere lo zucchero prima del latte, poi il latte preriscaldato a filo, sempre mescolando per evitare i grumi, la vaniglia e il Suk; alla fine il cacao spolverato e il cioccolato."]}]},{"id":"14-passatelli","num":14,"title":"Passatelli","subtitle":null,"cat":"primi","emoji":"🍜","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":3,"n":"uova intere"},{"q":200,"u":"g","n":"pane grattugiato","di":true,"note":"150 ?"},{"q":100,"u":"g","n":"grana grattugiato","di":true,"note":"150 ?"},{"q":1,"u":"noce","n":"burro"},{"n":"Scorza di ½ limone grattugiata"},{"n":"Sale"},{"n":"Noce moscata"},{"q":1,"u":"l","n":"brodo","di":true,"note":"½ pollo e ½ carne"}]}],"steps":[{"title":null,"items":["Mescolare pane e formaggio, mescolare con le uova e aggiungere gli altri ingredienti fino ad ottenere un impasto solido, eventualmente correggere con brodo per ammorbidire o pane per indurire. Lavorare l’impasto per una decina di minuti per amalgamarlo bene e poi lasciare riposare per almeno 1 ora.","Metterli nel brodo usando lo schiacciapatate con il filtro largo."]}]},{"id":"15-creme-caramel","num":15,"title":"Crème caramel","subtitle":null,"cat":"dolci","emoji":"🍮","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":5,"n":"uova intere"},{"q":5,"q2":6,"u":"cucchiai","n":"zucchero"},{"q":400,"u":"g","n":"panna","di":true},{"q":400,"u":"g","n":"latte","di":true},{"q":1,"u":"busta","n":"vanillina"}]}],"steps":[{"title":null,"items":["Sbattere tutto con la frusta.","Mettere caramello nello scodello e poi il composto, coprire con il coperchio.","Cuocere in pentola a bagnomaria pressione 25 - 30 minuti circa."]}]},{"id":"16-impasto-per-spara-biscotti","num":16,"title":"Impasto per spara-biscotti","subtitle":null,"cat":"basi","emoji":"🍪","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":90,"u":"g","n":"zucchero","di":true},{"q":170,"u":"g","n":"burro","di":true},{"q":1,"n":"uovo"},{"q":270,"u":"g","n":"farina","di":true},{"q":1,"u":"bustina","n":"vanillina"}]}],"steps":[{"title":null,"items":["Versare lo zucchero in una ciotola con il burro appena scaldato, mescolare fino ad avere un morbido impasto. Aggiungere l’uovo e mescolarlo insieme alla vanillina. Con l’impasto aggiungere un po’ alla volta la farina setacciandola e mescolare fino ad avere un impasto spumoso.","Riempire la spara-biscotti.","Direttamente sulla teglia senza carta forno, “sparare” i biscotti con la pistola.","A forno caldo a 180 gradi aspettare la doratura (circa 10 minuti) poi togliere."]}]},{"id":"17-polpette-di-carne-cruda","num":17,"title":"Polpette di carne cruda","subtitle":null,"cat":"secondi","emoji":"🧆","servings":2,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":250,"u":"g","n":"carne trita scelta di vitellone","di":true},{"q":50,"u":"g","n":"pane bianco ammollato nel latte","di":true,"note":"o una patata lessata"},{"q":1,"n":"uovo"},{"q":2,"u":"cucchiai","n":"grana grattugiato"},{"q":1,"u":"cucchiaino","n":"erbe aromatiche tritate"},{"n":"Olio extra vergine di oliva"},{"n":"Pangrattato"},{"n":"Salsa di pomodoro","note":"facoltativa"},{"n":"Sale, pepe, noce moscata"}]}],"steps":[{"title":null,"items":["Mescolare la carne trita con un terzo del suo peso di pane bianco ammollato nel latte e strizzato, formaggio grattugiato, sale, pepe, erbe aromatiche, poca cipolla o aglio o scalogno tritato e ancora altro a piacere.","Compattare bene il composto e far riposare in frigorifero per un paio di ore.","Formare tante polpette del peso e della forma preferita, tonda, ovoidale o appiattita.","Passarle nel pangrattato e rosolarle in padella con un filo d’olio per qualche minuto, oppure tuffarle nella salsa di pomodoro ben calda oppure cuocerle in forno ventilato a 200°C, per circa 10 minuti, appena unte di olio e adagiate su teglia, preferibilmente fornita di carta da forno, sino a renderle ben dorate."]}]},{"id":"18-dado-di-carne","num":18,"title":"Dado di carne","subtitle":null,"cat":"basi","emoji":"🧊","servings":1,"servingsLabel":"dose","servingsGuess":false,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":0.5,"u":"kg","n":"manzo magro","di":true},{"q":0.5,"u":"kg","n":"carote","di":true},{"q":400,"u":"g","n":"sedano","di":true},{"q":400,"u":"g","n":"cipolle bianche","di":true},{"q":150,"u":"g","n":"sale grosso","di":true}]}],"steps":[{"title":null,"items":["Tagliare a dadini ogni ingrediente e mettere tutto nella pentola a pressione per 1,5 ore.","Frullare ed eventualmente condensare sul fuoco.","Mettere nella vaschetta per cubetti giaccio.","La verdura può essere cambiata, non usare patate."]}]},{"id":"19-crema-catalana","num":19,"title":"Crema catalana","subtitle":null,"cat":"dolci","emoji":"🔥","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":4,"n":"tuorli"},{"q":5,"u":"cucchiai","n":"zucchero"},{"q":25,"u":"g","n":"amido di mais","di":true,"note":"maizena"},{"q":500,"u":"ml","n":"latte","di":true},{"q":1,"u":"stecca","n":"cannella"},{"n":"Scorza di limone"},{"n":"Zucchero di canna e noce moscata","note":"per la caramellatura"}]}],"steps":[{"title":null,"items":["Per preparare la crema catalana, rompete le uova e dividete i tuorli dagli albumi. Montate i rossi delle uova con lo zucchero: ottenere una crema soffice e spumosa.","In un’altra ciotola mettete l’amido di mais setacciato e scioglietelo con due cucchiai di latte.","Mettere il restante latte e la buccia del limone in un pentolino e far bollire, aggiungere un pizzico di cannella. Toglietelo dalla fiamma e far raffreddare leggermente, versare il latte nella ciotola con le uova e lo zucchero, filtrando per eliminare le scorze di limone.","Mescolare con cura il composto, rimettere nel pentolino e portare nuovamente a ebollizione per qualche minuto, mescolando continuamente con un cucchiaio di legno. Versare la crema nelle coppette per servire.","Far raffreddare a temperatura ambiente, e poi in frigo per circa 4 ore, durante questo tempo la crema catalana si solidificherà. Prima di servire cospargere la superficie di zucchero di canna mescolato con un pizzico di noce moscata: con una piccola fiamma caramellate lo zucchero che dovrà diventare marrone ma non dovrà bruciare."]}]},{"id":"20-pollo-alla-marengo","num":20,"title":"Pollo alla Marengo","subtitle":null,"cat":"secondi","emoji":"🍗","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":500,"u":"g","n":"petti di pollo","di":true},{"q":500,"u":"ml","n":"vino bianco","di":true},{"q":500,"u":"g","n":"pomodori pelati","di":true},{"q":1,"u":"spicchio","n":"aglio"},{"q":1,"n":"limone"},{"q":1,"u":"ciuffo","n":"prezzemolo"},{"n":"Olio di oliva"},{"n":"Farina q.b."}]},{"title":"Per la guarnizione (quantità non indicate)","items":[{"n":"Fette di pane q.b."},{"n":"Uova q.b."}]}],"steps":[{"title":null,"items":["Passate il pollo nella farina; poi sbucciate lo spicchio d’aglio e tritate finemente il ciuffo di prezzemolo.","In una padella scaldate un filo d’olio con lo spicchio d’aglio sbucciato, aggiungere i pezzi di pollo e far rosolare. Salare e pepare a piacere, quando il pollo sarà ben rosolato versare 100 ml di vino bianco.","Far evaporare prima di versare la i pomodori pelati, cuocere per circa 40 minuti con il coperchio. Aggiungere il succo di limone, mescolate per pochi minuti prima di spegnere il fuoco, aggiungete il prezzemolo tritato.","In una padella versate 3 cucchiai d’olio, fate tostare le fette di pane mentre in un’altra padella friggete per pochi minuti le uova con altri due cucchiai d’olio salandoli."]}]},{"id":"21-verdure-ripiene","num":21,"title":"Verdure ripiene","subtitle":null,"cat":"secondi","emoji":"🫑","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":500,"u":"g","n":"carne tritata","di":true},{"q":2,"q2":3,"n":"uova intere"},{"q":100,"u":"g","n":"formaggio grattugiato","di":true},{"n":"Pane grattugiato"},{"n":"Sale e pepe"},{"n":"Noce moscata"},{"n":"Prezzemolo"},{"n":"Zucchine e peperoni"}]}],"steps":[{"title":null,"items":["In una terrina mescolare, a freddo con le mani, la carne con le uova, mettere il formaggio insaporire con sale, pepe, noce moscata e prezzemolo; alla fine usare il pane grattugiato per avere un impasto asciutto e consistente.","Svuotare le verdure, tenendo l’interno delle zucchine. Riempire le verdure e metterle in una pentola (meglio a pressione) con due dita di olio, acqua, salsa di pomodoro e l’interno delle zucchine. Cuocere con coperchio per circa 30’ (15’ nella pentola a pressione), aggiungere acqua se necessario.","Mettere tutto in una pirofila e cuocere a 180° nel forno per altri 30’, fino a quando l’acqua si è asciugata."]}]},{"id":"22-torta-di-rose-manitoba","num":22,"title":"Torta di rose (Manitoba)","subtitle":null,"cat":"lievitati","emoji":"🌹","servings":10,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":"Nel PDF questa ricetta è corredata di foto passo-passo. Stampo: tortiera da 28 cm.","link":null,"tips":[],"ingredients":[{"title":"Impasto e crema di burro","items":[{"q":500,"u":"g","n":"farina Manitoba","di":true},{"q":3,"n":"uova medie"},{"q":1,"u":"cucchiaino","n":"miele"},{"q":7,"u":"g","n":"sale fine","di":true},{"q":200,"u":"ml","n":"latte","di":true},{"q":10,"u":"g","n":"lievito di birra","di":true},{"n":"Scorza d’arancia"},{"q":25,"u":"g","n":"estratto di vaniglia","di":true},{"q":80,"u":"g","n":"zucchero","di":true},{"q":100,"u":"g","n":"burro","di":true}]},{"title":"Farcitura e finitura (quantità non indicate)","items":[{"n":"Burro ammorbidito q.b."},{"n":"Farina di mandorle q.b."},{"n":"Panna q.b."},{"n":"Marmellata di arance q.b."},{"q":1,"n":"tuorlo"},{"n":"Lamelle di mandorle q.b."},{"n":"Zucchero a velo q.b."}]}],"steps":[{"title":null,"items":["Sbriciolate il lievito dentro ad una ciotolina e aggiungete poco latte tiepido e un cucchiaino di miele, quindi mescolate per disciogliere il tutto.","Mettete nella ciotola di una planetaria munita di foglia la farina, aggiungete il composto di lievito, il restante latte e la scorza grattugiata dell’arancia azionando la macchina su una velocità minima, quindi unite le uova a temperatura ambiente precedentemente sbattute con una forchetta, lo zucchero, l’estratto di vaniglia e in ultimo il sale. Lasciate lavorare per almeno 10-15 minuti.","Poi unite, un pezzetto alla volta, il burro ammorbidito: non aggiungete un nuovo pezzetto se prima non è stato ben assorbito il precedente (per far assorbire tutto il burro ci vorranno almeno 10 minuti di lavorazione che potete effettuare utilizzando il gancio). Quando l’impasto sarà liscio, elastico e si staccherà dai lati della ciotola, rovesciatelo su una spianatoia, lavoratelo qualche secondo per dargli la forma di una palla e poi riponetelo in una ciotola spennellata con del burro, e copritela con della pellicola trasparente.","Mettetelo a lievitare per almeno 2 ore nel forno spento ma con la luce accesa fino a che non duplichi il volume.","Mettete il burro ammorbidito dentro alla ciotola di una planetaria munita di frusta, unite lo zucchero e montate il tutto fino a ottenere un composto bianco e molto spumoso, al quale unirete la farina di mandorle e la panna a temperatura ambiente.","Prendete l’impasto lievitato e stendetelo col matterello su di una spianatoia infarinata, ottenendo un rettangolo formato da una sfoglia spessa 2 mm avente un lato di circa 60 cm e l’altro di 40-45 cm. Lavorate la marmellata di arance con un cucchiaio fino a renderla morbida e poi spalmatela sulla sfoglia.","Spalmate la crema di burro sulla sfoglia e poi arrotolatela sulla sua parte più lunga. Tagliate il rotolo ottenuto in 12 pezzi dello spessore di 4-5 cm l’uno.","Imburrate e infarinate una tortiera del diametro di 28 cm e ponete all’interno di essa, cominciando dal perimetro, le rose di pasta, lasciando qualche cm di spazio tra di esse. Terminate ponendo anche al centro 3-4 rose di pasta e poi mettetele a lievitare per almeno 1 ora nel forno spento ma con la luce accesa.","Quando le rose avranno raddoppiato il loro volume e si saranno attaccate, spennellatele con il tuorlo sbattuto assieme alla panna, cospargete con delle lamelle di mandorle e poi infornate in forno statico già caldo a 180° per circa 45-50 minuti (se utilizzate quello ventilato abbassate a 160° la temperatura del forno). Fate la prova stecchino per verificare l’avvenuta cottura.","Sfornate la torta delle rose, lasciatela intiepidire e poi sformatela. Volendo potete spolverizzarla di zucchero a velo."]}]},{"id":"23-danubio-dolce","num":23,"title":"Danubio dolce","subtitle":null,"cat":"lievitati","emoji":"🍞","servings":10,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":"Nel PDF questa ricetta è corredata di foto passo-passo. Stampo: tortiera da 28 cm.","link":null,"tips":[{"title":"Conservazione","text":"Conservate il Danubio dolce sotto una campana di vetro per alcune ore e in frigorifero coperto con pellicola per 1-2 giorni. Si può congelare se avete utilizzato tutti ingredienti freschi non decongelati."},{"title":"Consiglio","text":"Potete farcire il Danubio dolce con delle confetture, crema alla nocciola o crema pasticcera al cioccolato e per distinguere i ripieni potete decorare le palline con codette colorate o zuccherini dopo aver spennellato il Danubio e prima di infornare!"}],"ingredients":[{"title":"Impasto","items":[{"q":530,"u":"g","n":"farina Manitoba","di":true},{"q":30,"u":"g","n":"zucchero","di":true},{"q":50,"u":"g","n":"burro","di":true},{"q":230,"u":"ml","n":"latte intero","di":true},{"q":4,"u":"g","n":"lievito di birra secco","di":true,"note":"oppure 12 g di fresco"},{"q":1,"n":"uovo medio"},{"n":"Scorza di limone","note":"non trattato"},{"q":1,"n":"baccello vaniglia"},{"q":10,"u":"g","n":"sale fine","di":true},{"q":50,"u":"ml","n":"acqua","di":true}]},{"title":"Crema pasticcera (quantità non indicate)","items":[{"n":"Latte q.b."},{"n":"Panna q.b."},{"n":"Scorza di 1 limone"},{"n":"Semi di 1 bacca di vaniglia"},{"n":"Tuorli q.b."},{"n":"Zucchero q.b."},{"n":"Amido di mais q.b.","note":"o fecola di patate"}]},{"title":"Per finire","items":[{"q":1,"n":"uovo"},{"q":1,"u":"cucchiaio","n":"latte"},{"n":"Zucchero a velo q.b."}]}],"steps":[{"title":"Impasto","items":["Fate fondere il burro (al microonde o a bagnomaria). Versate nella planetaria munita di foglia la farina setacciata, grattugiate la scorza di 1 limone non trattato, unite lo zucchero, i semi di una bacca di vaniglia e il lievito di birra disidratato.","Azionate la planetaria per miscelare gli ingredienti, poi versate il latte a temperatura ambiente, l’uovo medio, proseguite con il burro fuso e quando gli ingredienti si saranno raccolti attorno alla foglia, arrestate la planetaria e sostituite la foglia con il gancio, quindi aggiungete il sale (potete discioglierlo in 50 ml di acqua a temperatura ambiente o aggiungere quest’ultima da sola dopo il burro fuso); continuate ad impastare fino a quando l’impasto non si sarà incordato e sarà divenuto morbido e omogeneo.","Trasferitelo su un piano di lavoro leggermente imburrato e maneggiatelo per dare una forma sferica; ponetelo in una ciotola leggermente imburrata e copritelo con pellicola trasparente; lasciate lievitare per 2 ore in forno spento con luce accesa (oppure coprendo la ciotola con una copertina di lana)."]},{"title":"Crema pasticcera","items":["In un tegame versate il latte e la panna e scaldate a fuoco lento insieme alla scorza grattugiata di 1 limone non trattato e ai semi di 1 bacca di vaniglia (per un aroma più intenso potete mettere in infusione anche la bacca di vaniglia incisa e toglierla successivamente).","In un altro tegame, versate i tuorli (con gli albumi potete realizzare delle meringhe o le lingue di gatto), unite lo zucchero. Lavorate i tuorli con lo zucchero con una frusta, poi setacciate l’amido di mais (potete anche utilizzare la fecola di patate, mentre la farina tende a rendere la crema opaca). Mescolate ancora e poi versate a filo il latte scaldato in precedenza e aromatizzato (abbiate cura di togliere la bacca di vaniglia prima di versare il latte se l’avete utilizzata). Portate tutto su fuoco lento e mescolate fino a quando la crema non avrà raggiunto la consistenza ideale addensandosi.","A quel punto spegnete il fuoco e trasferite la crema in una pirofila bassa e ampia: coprite con pellicola trasparente a contatto, perché freddandosi non si formi la fastidiosa pellicina in superficie. Quindi fatela raffreddare a temperatura ambiente e poi in frigorifero."]},{"title":"Formatura e cottura","items":["Quando l’impasto avrà raddoppiato il suo volume, prendetelo e stendetelo formando un filoncino su un piano di lavoro leggermente infarinato (o oleato). Ricavate con il tarocco (o un coltello dalla lama ben affilata) 30 pezzetti da 30 g l’uno; stendete ciascun pezzetto con il mattarello e farcitelo con un cucchiaio di crema pasticcera oramai fredda e rassodata.","Richiudete ciascun dischetto pizzicando e sigillando bene i lembi perché il ripieno non fuoriesca e proseguite per tutte le palline. A mano a mano che realizzate il Danubio, potete adagiare le palline su una tortiera di 28 cm di diametro foderata con carta da forno, disponendole a raggiera a partire dal perimetro più esterno, fino ad arrivare al centro.","Coprite con pellicola trasparente il Danubio così formato e fate lievitare ancora per 1 ora in forno spento con luce accesa. Dopodiché spennellate la superficie con l’uovo sbattuto con 1 cucchiaio di latte, quindi cuocete in forno statico preriscaldato a 180° per 30 minuti (se forno ventilato a 160° per circa 20 minuti). Una volta cotto, sfornatelo e lasciatelo intiepidire; spolverizzatelo con lo zucchero a velo.","Servite il Danubio dolce direttamente nella teglia e invitate gli ospiti a staccare ciascuna pallina con le mani!"]}]},{"id":"24-ripieno-tortellini-originale","num":24,"title":"Ripieno tortellini originale","subtitle":null,"cat":"basi","emoji":"🥟","servings":1,"servingsLabel":"dose","servingsGuess":false,"intro":"Il vero tortellino. Ricetta del ripieno dei tortellini, depositata il 7 dicembre 1974 con atto notarile alla Camera di Commercio di Bologna dalla dotta Confraternita del Tortellino e dall’Academia Italiana della Cucina.","note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":100,"u":"g","n":"lombo di maiale","di":true},{"q":100,"u":"g","n":"prosciutto crudo","di":true},{"q":100,"u":"g","n":"mortadella","di":true},{"q":150,"u":"g","n":"parmigiano reggiano","di":true,"note":"stagionato almeno 3 anni; di più se più giovane"},{"q":1,"n":"uovo"},{"n":"Noce moscata"},{"n":"Sale, pepe, rosmarino, aglio"},{"n":"Un po’ di burro"}]}],"steps":[{"title":null,"items":["La preparazione deve essere molto accurata: il lombo (100 grammi) deve essere tenuto a riposo per due giorni con sopra un battuto composto di sale, pepe, rosmarino ed aglio, quindi va cotto a fuoco lento con un po’ di burro e poi tolto dal tegame e ripulito dal suo battuto.","Infine con il battilardo si trita molto finemente il lombo, il prosciutto crudo (100 gr) e la mortadella (100 gr) e si impasta tutto con il parmigiano reggiano (150 gr se stagionato da almeno 3 anni, in maggiore quantità se più giovane), e un uovo, aggiungendo noce moscata.","L’impasto si deve mescolare a lungo fintanto che risulti bene amalgamato. Lo si lasci riposare per almeno 24 ore prima di riempire i tortellini.","Per gustare un buon tortellino, indispensabile disporre di un ottimo brodo, fatto con carne di cappone ruspante (non allevato con i mangimi) e carne di manzo (punta di petto, doppione, falata)."]}]},{"id":"25-peperonata","num":25,"title":"Peperonata","subtitle":null,"cat":"contorni","emoji":"🫑","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":1,"u":"kg","n":"peperoni gialli, rossi e verdi","di":true},{"q":400,"u":"g","n":"cipolla di Tropea","di":true},{"q":400,"u":"g","n":"passata di pomodoro","di":true},{"q":40,"u":"ml","n":"olio extra vergine","di":true},{"q":2,"u":"spicchi","n":"aglio"},{"n":"Sale, pepe, peperoncino, zucchero q.b."}]}],"steps":[{"title":null,"items":["Per preparare la peperonata, lavate e asciugate i peperoni, quindi affettateli per lungo, tutto attorno al torsolo, togliete i filamenti bianchi e riduceteli a falde sottili. Mondate e affettate anche le cipolle.","In un tegame capiente versate un filo d’olio e gli spicchi d’aglio mondati ma interi, fate scaldare quindi unite le cipolle.","Fate stufare le cipolle a fuoco medio-basso per circa 15 minuti mescolando di tanto in tanto, se necessario aggiungendo un po’ d’acqua, fino quando saranno ammorbidite e avranno rilasciato la loro acqua.","Versate i peperoni, aggiustate di sale e pepe, aggiungere un pizzico di peperoncino quindi mescolate e coprite con un coperchio.","Cuocete i peperoni per altri 15 minuti circa a fuoco medio, passato questo tempo i peperoni saranno ammorbiditi, eliminate gli spicchi d’aglio, versate la passata di pomodoro mescolate e cuocete ancora per 15 minuti sempre con il coperchio, se necessario mettere un cucchiaino o due di zucchero per togliere l’acidità del pomodoro.","Terminata la cottura la vostra peperonata è pronta per essere gustata calda, tiepida o anche fredda per accompagnare secondi di carne, pesce, formaggi o anche per condire la pasta."]}]},{"id":"26-torta-di-rose-2-carla","num":26,"title":"Torta di rose 2 (Carla)","subtitle":null,"cat":"lievitati","emoji":"🌹","servings":8,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":500,"u":"g","n":"farina","di":true},{"q":25,"u":"g","n":"lievito di birra","di":true},{"q":2,"u":"tazzine","n":"acqua","note":"50-60 g"},{"q":3,"u":"cucchiai","n":"zucchero"},{"q":50,"u":"g","n":"margarina","di":true},{"q":1,"n":"uovo"},{"q":1,"n":"pizzico sale"},{"q":1,"u":"bustina","n":"vaniglia"},{"q":100,"u":"g","n":"uvetta","di":true,"note":"facoltativa"}]}],"steps":[{"title":null,"items":["Sciogliere lo lievito nell’acqua tiepida, aggiungere un cucchiaino di zucchero e 2-3 cucchiaia di farina fino ad ottenere una cremina; coprire e lasciar lievitare per mezz’ora in un luogo tiepido, fino a quando diventa spumoso.","Aggiungere l’uovo, la margarina fusa e sbattere bene, aggiungendo poi tre cucchiai di zucchero e la farina, mescolando per ottenere una pasta morbida. Aggiungere il sale e vaniglia, lasciando poi riposare per circa 2 ore coprendo e in un posto tiepido.","Stendere l’impasto, ungere con il burro (o margarina ammorbidita in acqua). Arrotolare e tagliare le brioches, adagiare in una teglia e lasciar riposare per un’altra mezz’ora.","Infornare in forno preriscaldato a 200° e cuocere per mezz’ora."]}]},{"id":"27-cappellacci-con-la-zucca","num":27,"title":"Cappellacci con la zucca","subtitle":null,"cat":"primi","emoji":"🎃","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":1,"u":"kg","n":"zucca violina","di":true},{"q":300,"u":"g","n":"parmigiano grattugiato","di":true},{"q":1,"n":"uovo"},{"n":"Sale e pepe"},{"q":10,"u":"g","n":"noce moscata","di":true},{"q":150,"u":"g","n":"amaretti","di":true,"note":"per la mantovana"}]}],"steps":[{"title":"Ferrarese","items":["Tagliate la zucca a pezzi, eliminare i semi ed i filamenti e cuocere al forno. Servendovi di un cucchiaio togliere la parte più tenera della polpa lontano dalla buccia, passarla al setaccio e amalgamarla con gli altri ingredienti.","Aggiungere pane grattato o formaggio per ottenere un impasto non troppo molle e umido."]},{"title":"Mantovana","items":["Tritare molto fine gli amaretti e unirli all’impasto, la ricetta originale prevede anche un pezzetto di mostarda piccante di mele o pere."]}]},{"id":"28-pasticcio-di-maccheroni","num":28,"title":"Pasticcio di maccheroni","subtitle":null,"cat":"primi","emoji":"🥧","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":300,"u":"g","n":"tacchino per ragù","di":true,"note":"oppure pollo, maiale…"},{"q":1,"u":"l","n":"besciamella","di":true},{"q":10,"u":"g","n":"funghi secchi","di":true},{"q":250,"u":"g","n":"pasta","di":true,"note":"pennette o simili"},{"q":1,"n":"pasta frolla","note":"oppure sfoglia"},{"n":"Grana, burro, sale q.b."},{"n":"Burro o olio al tartufo","note":"a piacere"}]}],"steps":[{"title":null,"items":["Con la carne preparare il ragù bianco (come al solito ma senza pomodoro). Mettere a mollo i funghi secchi.","Preparare la besciamella, cuocere le pennette al dente e mescolare tutto con il ragù e abbondante grana grattugiato.","Foderare una teglia con la pasta frolla, versare il composto, coprire il tutto con pasta frolla chiudendo i bordi.","Mettere in forno a 180° per circa mezz’ora."]}]},{"id":"29-gaufres-waffle","num":29,"title":"Gaufres / Waffle","subtitle":null,"cat":"colazione","emoji":"🧇","servings":4,"servingsLabel":"porzioni","servingsGuess":true,"intro":null,"note":null,"link":{"url":"https://www.dailymotion.com/video/x8q3j93","label":"Video della ricetta alternativa"},"tips":[],"ingredients":[{"title":"Ricetta di Liegi","items":[{"q":225,"u":"g","n":"farina 00","di":true},{"q":80,"u":"g","n":"burro","di":true},{"q":125,"u":"g","n":"zucchero","di":true,"note":"perlato o anche di canna"},{"n":"Qualche goccia estratto di vaniglia"},{"q":70,"u":"g","n":"uova","di":true},{"q":5,"u":"g","n":"lievito di birra fresco","di":true},{"q":65,"u":"g","n":"latte","di":true},{"n":"Un pizzico sale"},{"q":0.5,"u":"g","n":"cannella","di":true}]},{"title":"Alternativa","items":[{"q":500,"u":"g","n":"farina 00","di":true},{"q":30,"u":"g","n":"zucchero","di":true,"note":"50 di canna"},{"q":15,"u":"g","n":"lievito di birra fresco","di":true},{"q":2,"n":"uova"},{"q":220,"u":"ml","n":"latte","di":true},{"q":200,"u":"g","n":"burro","di":true},{"q":250,"u":"g","n":"zucchero perlato","di":true},{"q":0.5,"u":"g","n":"cannella","di":true},{"n":"Qualche goccia estratto di vaniglia"}]}],"steps":[{"title":"Preparazione 1 (ricetta di Liegi)","items":["Intiepidire il latte e fare sciogliere il lievito, poi aggiungere la farina. Quando l’impasto è uniforme aggiungere le uova sbattute il sale e la vaniglia. Continuare ad impastare e lasciar lievitare per mezz’ora.","Ammorbidire il burro e aggiungerlo poco alla volta continuando ad impastare fino a quando il burro sarà tutto incorporato.","Aggiungere lo zucchero e impastare a bassa velocità o a mano.","Fare lievitare per 3 o 4 ore (2 se fa caldo). Dividere l’impasto in 7 (circa 80 gr cad.).","Cuocere per circa 3’ e servire tiepide con abbondante zucchero a velo."]},{"title":"Preparazione 2","items":["Sbattere le uova fino a renderle schiumose, aggiungere zucchero, zucchero vanigliato e continuare a mescolare.","Mettere nella ciotola dell’impastatrice la farina lo lievito, 100 gr zucchero e 100 ml di latte, spolverare di farina, lasciar riposare in un luogo caldo fino a quando la farina si screpola.","Aggiungere il burro o margarina sciolti, continuando a mescolare con la frusta ad alta velocità aggiungere gli altri ingredienti e, poco per volta, il latte e la farina, in modo da ottenere un impasto omogeneo.","Lasciar riposare in un luogo caldo per un’ora e cuocere a 3/4 di potenza per 4 o 5 minuti."]},{"title":"Preparazione 3 (alternativa)","items":["Mettere la farina, zucchero e lievito nell’impastatrice e mescolare, continuando ad impastare a velocità 3 aggiungere uova, latte cannella e vaniglia, impastare per circa 4’.","Ammorbidire il burro e aggiungerlo poco per volta impastando veloce per 10’.","Lasciar riposare in frigo per 2 ore, poi aggiungere lo zucchero perlato e mescolare piano per incorporarlo nell’impasto.","Dividere in parti da circa 90 gr e cuocere per 4’ circa. Servire con abbondante zucchero a velo."]}]},{"id":"30-pancake","num":30,"title":"Pancake","subtitle":null,"cat":"colazione","emoji":"🥞","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":200,"u":"g","n":"farina","di":true},{"q":250,"u":"g","n":"latte","di":true},{"q":250,"u":"g","n":"panna","di":true,"note":"+ farina q.b."},{"q":2,"n":"uova"},{"q":30,"u":"g","n":"zucchero","di":true,"note":"semolato o di canna"},{"q":30,"u":"g","n":"olio di semi","di":true,"note":"oppure 30 g di burro fuso"},{"q":1,"u":"bustina","n":"lievito per dolci","note":"in alternativa 1 cucchiaino di bicarbonato e un cucchiaio di succo di limone"},{"n":"Estratto di vaniglia"},{"q":1,"n":"pizzico sale"},{"n":"Una noce di burro per la cottura"}]}],"steps":[{"title":null,"items":["Mescolare in una ciotola uova, olio, latte e limone con una frusta a mano, per ultima aggiungere la panna.","A parte setacciate farina, lievito, bicarbonato e mescolare insieme a zucchero e sale, poi unire gli ingredienti secchi a quelli liquidi e mescolare piano. L’impasto dei pancakes deve presentarsi morbido, fluido, corposo e non eccessivamente liquido, eventualmente aggiungere farina.","Il segreto per non bruciare i pancake è cuocere a fuoco lento. Usare una padella antiaderente, meglio se piccola, passare il burro in padella con un fazzoletto.","Una volta scaldata la padella, aggiungere un mestolo di impasto senza schiacciare, lasciar cuocere qualche secondo, quando compaiono le bollicine girarli con una paletta e cuocere ancora max 20 – 25”.","Metterli a raffreddare senza impilarli per evitare di schiacciarli."]}]},{"id":"31-frittelle-di-mele","num":31,"title":"Frittelle di mele","subtitle":null,"cat":"colazione","emoji":"🍎","servings":6,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":500,"u":"g","n":"farina","di":true},{"q":150,"u":"g","n":"zucchero","di":true},{"q":0.5,"u":"bustina","n":"lievito"},{"q":3,"n":"uova"},{"q":5,"n":"mele"},{"n":"Pizzico di sale"},{"n":"Latte q.b."}]}],"steps":[{"title":null,"items":["Sbucciare le mele e tagliarle a fette rotonde.","Impastare tutti gli ingredienti con il latte fino ad ottenere un impasto omogeneo.","Mettere le fette di mela nell’impasto e cuocerle nell’olio bollente."]}]},{"id":"32-pasta-con-speck-zucchine-e-pancetta","num":32,"title":"Pasta con speck, zucchine e pancetta","subtitle":null,"cat":"primi","emoji":"🍝","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":"Nel ricettario manca l’elenco ingredienti: è ricavato dal procedimento, quantità a piacere.","link":null,"tips":[],"ingredients":[{"title":"Ingredienti (quantità non indicate)","items":[{"n":"Pasta q.b."},{"n":"Speck a listarelle q.b."},{"n":"Pancetta q.b."},{"n":"Zucchine q.b."},{"n":"Panna q.b."},{"n":"Olio q.b."},{"n":"Sale q.b."}]}],"steps":[{"title":null,"items":["Tagliare a listarelle lo speck, lavare e mondate le zucchine, poi tagliatele alla julienne con una grattugia a fori larghi.","In una padella antiaderente scaldare l’olio, poi rosolare lo speck per qualche minuto, aggiungere le zucchine e proseguite la cottura.","Fate cuocere la pasta in acqua leggermente salata, scolare quando al dente.","Versare in padella la panna, aggiungere un goccio di acqua di cottura della pasta e mescolare per amalgamare. Scolare la pasta e trasferitela direttamente nella padella con il sugo."]}]},{"id":"33-torta-di-cioccolato-e-pere","num":33,"title":"Torta di cioccolato e pere","subtitle":null,"cat":"dolci","emoji":"🍐","servings":8,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":3,"n":"uova"},{"q":3,"u":"cucchiai","n":"zucchero"},{"q":100,"u":"g","n":"cioccolato fondente","di":true},{"q":200,"u":"g","n":"ricotta","di":true},{"q":4,"q2":5,"u":"cucchiai","n":"farina bianca"},{"q":1,"u":"bustina","n":"lievito"},{"q":1,"u":"rotolo","n":"pasta frolla"},{"q":4,"n":"pere"}]}],"steps":[{"title":null,"items":["Montare i tuorli con lo zucchero, aggiungere gli albumi montati a neve, il cioccolato liquefatto, ricotta, farina e lievito mescolando con la frusta. Poi incorporare le pere a fettine sottili.","Foderare una tortiera con carta forno e stendervi la pasta frolla, riempire con l’impasto.","Cuocere a 180° per un’ora circa."]}]},{"id":"34-pancake-dolci-con-albumi","num":34,"title":"Pancake dolci con albumi","subtitle":null,"cat":"colazione","emoji":"🥞","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":250,"u":"g","n":"farina","di":true},{"q":250,"u":"ml","n":"latte","di":true},{"q":2,"n":"albumi"},{"n":"Zucchero semolato"},{"n":"Lievito in polvere per dolci"},{"n":"Estratto di vaniglia"},{"n":"Olio di semi"},{"n":"Sale"}]}],"steps":[{"title":null,"items":["Montare gli albumi a neve con un pizzico di sale; a parte unire la farina e un cucchiaio di lievito e setacciare il composto con un cucchiaio di zucchero, aggiungere il latte, un cucchiaio di olio e un cucchiaio di estratto di vaniglia, mescolando per ottenere un impasto omogeneo.","Incorporare gli albumi mescolando dal basso verso l’alto. Volendo si può aggiungere una banana molto matura ben schiacciata.","Ungere con poco olio (burro?) una padella antiaderente e scaldarla su fuoco vivace, abbassare il fuoco e mettere un mestolo di composto e cuocere per un paio di minuti, quindi voltare e cuocere per altri due minuti, finché non si formano le bollicine in superficie e i bordi appariranno ben cotti. Continuare fino alla fine del composto.","Servire i pancake caldi unendo marmellata, sciroppo d’acero o simili."]}]},{"id":"35-shokupan","num":35,"title":"Shokupan","subtitle":"pane soffice giapponese","cat":"lievitati","emoji":"🍞","servings":1,"servingsLabel":"pagnotta","servingsGuess":false,"intro":null,"note":"Tre ricette a confronto: scegli la tua! Le dosi si scalano per tutte insieme.","link":null,"tips":[],"ingredients":[{"title":"Ricetta 1 · water roux","items":[{"q":30,"u":"g","n":"farina Manitoba","di":true},{"q":100,"u":"ml","n":"acqua","di":true}]},{"title":"Ricetta 1 · impasto","items":[{"q":350,"u":"g","n":"farina Manitoba","di":true},{"q":100,"u":"ml","n":"latte","di":true},{"q":60,"u":"g","n":"zucchero","di":true},{"q":5,"u":"g","n":"lievito di birra secco","di":true},{"q":7,"u":"g","n":"sale","di":true},{"q":1,"n":"uovo intero"},{"q":50,"u":"g","n":"burro ammorbidito","di":true}]},{"title":"Ricetta 2 · water roux (tang zhong)","items":[{"q":15,"u":"g","n":"farina 00","di":true},{"q":90,"u":"ml","n":"latte intero","di":true}]},{"title":"Ricetta 2 · impasto","items":[{"q":300,"u":"g","n":"farina 00","di":true},{"q":4,"u":"g","n":"lievito SAF Gold","di":true},{"q":100,"u":"ml","n":"latte","di":true},{"q":1,"n":"uovo"}]},{"title":"Ricetta 2 · da aggiungere alla fine","items":[{"q":30,"u":"g","n":"zucchero","di":true},{"n":"Un pizzico sale"},{"q":40,"u":"g","n":"burro ammorbidito","di":true}]},{"title":"Ricetta 3 · roux","items":[{"q":25,"u":"g","n":"farina 00","di":true},{"q":125,"u":"ml","n":"latte intero","di":true}]},{"title":"Ricetta 3 · impasto","items":[{"q":350,"u":"g","n":"farina 0","di":true},{"q":7,"u":"g","n":"lievito SAF Gold","di":true,"note":"o cubetto di lievito di birra"},{"q":180,"u":"ml","n":"latte freddo","di":true},{"q":1,"u":"cucchiaio","n":"miele di acacia"},{"q":1,"n":"uovo"}]},{"title":"Ricetta 3 · da aggiungere alla fine","items":[{"q":40,"u":"g","n":"zucchero","di":true},{"q":8,"u":"g","n":"sale","di":true},{"q":50,"u":"g","n":"burro ammorbidito","di":true}]}],"steps":[{"title":"Ricetta 1 · water roux","items":["Mettere la farina Manitoba in una ciotola, aggiungere l’acqua tiepida e mescolare. Una volta ottenuto un composto liscio e compatto, trasferire in un pentolino e scaldare a circa 70°. Versare in una piccola ciotola, coprire con pellicola e lasciarlo raffreddare e poi mettere in frigorifero a riposare per almeno 6 ore (meglio se tutta la notte)."]},{"title":"Ricetta 1 · impasto","items":["In un’altra ciotola, mescolare il latte tiepido, lo zucchero e il lievito. Aggiungi l’uovo, poi incorporare la farina, il water roux e il sale. Mescolare bene, unire il burro morbido e continuare a impastare.","Coprire l’impasto e lasciarlo lievitare per circa 2 ore in un luogo asciutto.","Dividere l’impasto in 3 porzioni, formare delle palline e lasciar riposare per altri 30 minuti.","Prendi le palline una per una, infarinare leggermente la superficie, appiattiscile con le mani e poi stendile con un mattarello. Piega prima i bordi laterali verso il centro, poi piega la parte inferiore verso l’alto arrotolando l’impasto, lasciando sotto la parte terminale.","Disponi i rotolini nello stampo da forno (es: quelli per pancake) già imburrato, coprire e lasciali lievitare per altri 30 minuti, fino a quando arrivano al bordo. Spennellare la superficie dell’impasto con la panna.","Cuocere in forno statico preriscaldato a 180° per 50’, a metà cottura coprire con carta stagnola. Lasciar raffreddare prima di toglierlo dallo stampo.","Si può tagliare a fette da 3 cm, eventualmente tostate e coperte con marmellata, nutella o fare dei panini con prosciutto o altro. Si può conservare lo shokupan per 1 settimana in un sacchetto per alimenti ben chiuso."]},{"title":"Ricetta 2 · water roux (tang zhong)","items":["Mettete il latte in un pentolino e spolverare con la farina 00 continuando a mescolare per evitare che faccia grumi. Cuocete il composto a fuoco medio-basso fino a quando non diventa una crema densa (circa 65 °C). Togliete dal fuoco e coprite con pellicola trasparente, toccando il composto in modo che non si formi la crosticina. Conservatelo in frigorifero per 12 ore nello scomparto più freddo."]},{"title":"Ricetta 2 · impasto","items":["Mescolare lo lievito con 2 cucchiai di latte caldo. Lasciate riposare per 10 minuti, finché non diventa schiumoso e spumeggiante.","Mescolate tutti gli ingredienti secchi in una ciotola, create un buco al centro e versate gli ingredienti umidi e il tang zhong preparato in precedenza. Impastate a velocità 2 con il gancio fino a quando tutto l’impasto granuloso non inizia a compattarsi in un’unica massa; potrebbero volerci circa 2-3 minuti. Non aggiungete liquidi. Potrebbe essere necessario fermarsi a metà cottura e raschiare l’impasto dal gancio e dai lati della ciotola, quindi impastare di nuovo più volte.","Una volta ottenuto un impasto grossolano, spegnete la macchina. Non preoccupatevi, l’impasto non sarà liscio. Coprite l’impasto con pellicola trasparente e lasciatelo riposare per 20 minuti. Questo è un riposo importante che i fornai chiamano autolisi.","Dopo il riposo, riaccendete la planetaria e impastate di nuovo a velocità 2 per 1-2 minuti, fino a ottenere un impasto leggermente più liscio. Aggiungete quindi il sale e lo zucchero. Continuate a impastare fino a ottenere un impasto relativamente liscio. Durante questo processo, fermatevi e raschiate l’impasto dal gancio e dalla ciotola più volte.","Una volta ottenuto un impasto liscio, riaccendete la macchina per impastare e aumentate la velocità a 4. Aggiungete gradualmente il burro ammorbidito, poco alla volta. L’impasto diventerà di nuovo un vero pasticcio appiccicoso a causa del burro, continuate a impastare e fermatevi a metà, raschiate di nuovo l’impasto dal gancio e dalla ciotola e continuate a impastare finché il burro non sarà assorbito dall’impasto. ACCADRÀ, non preoccupatevi! NON siate tentati di aggiungere altra farina. Otterrete un impasto liscio e lucido, molto elastico. Ci vorranno circa 10-15 minuti. L’impasto deve superare la prova della finestra, ovvero quando si allunga una piccola quantità di impasto sottilmente, non si romperà e la luce può passare attraverso.","Mettere l’impasto in una ciotola capiente leggermente unta, coprirlo con un canovaccio pulito e umido o con pellicola trasparente e lasciarlo in un luogo caldo per circa 1 ora, finché l’impasto non raddoppia di volume.","Sgonfiate l’impasto, poi arrotolatelo fino a formare una palla e conservatela in un contenitore ermetico e riponetela nella parte più fredda del frigorifero (non nel congelatore) per un massimo di 12 ore. Non consiglio di conservarla più a lungo. Procedete alla formatura.","Ungete leggermente lo stampo da plumcake. Potete anche usare uno spray antiaderente. Se l’impasto è freddo di frigorifero, lasciatelo riposare a temperatura ambiente per circa 15-20 minuti e poi procedete alla formatura. Sgonfiare l’impasto e dividerlo in 3 parti uguali. Coprire l’impasto con pellicola trasparente e lasciarlo riposare per 10 minuti per rilassare il glutine.","Stendete ogni pallina fino a formare un rettangolo (non è necessario essere precisi). Ripiegate i due lati lunghi verso l’alto e poi arrotolate dal basso verso l’alto. Posizionate la chiusura rivolta verso il basso nello stampo da plumcake e ripetete l’operazione con gli altri 2 impasti. Disponeteli uno accanto all’altro. Coprite con pellicola trasparente e far lievitare finché non arriva al bordo dello stampo (1 ora circa)."]},{"title":"Ricetta 2 · cottura al forno","items":["Posizionate la teglia sul ripiano centrale e lasciate cuocere per i successivi 25-30 minuti, a seconda del forno, la temperatura interna al centro del pane è di almeno 88 °C. Consiglio vivamente un termometro digitale per evitare ogni dubbio!","Sfornate, togliete il pane dalla teglia e lasciatelo raffreddare completamente sulla griglia. Gustatelo e, una volta raffreddato completamente, avvolgetelo nella pellicola trasparente: si conserva per circa 3 giorni a temperatura ambiente (a casa nostra non durava così a lungo)."]},{"title":"Ricetta 3","items":["Water roux: in un pentolino, cuocete il mix di farina e acqua a fuoco dolce, finché otterrete un gel. Spostatelo in una ciotolina e fatelo raffreddare, coprendolo con pellicola a contatto.","In una ciotola unite il roux ormai freddo e la farina. Poi aggiungete zucchero, sale, miele, lievito e latte poco alla volta e mescolate. Per ultimo incorporate piano piano il burro morbido e continuate a impastare fino a ottenere una pagnotta liscia. Fatela lievitare per 2 ore a temperatura ambiente, poi tutta la notte in frigo.","Terminato il tempo di lievitazione, dividete l’impasto in 3 pezzi da 245 g e date a ciascuno una forma sferica facendolo roteare con le mani sul piano da lavoro. Con l’aiuto del matterello stendete le tre porzioni in rettangoli.","Piegate un rettangolo riportando i lati lunghi verso il centro e poi arrotolate il tutto da un capo verso l’altro in modo da ottenere un cilindro. Procedete in questo modo con i 2 pezzi di impasto restanti.","Adagiate i cilindri ottenuti all’interno di uno stampo da plumcake da 25×11 cm, imburrato, disponendolo con la “chiusura” verso il basso. Coprite con la pellicola alimentare e fate lievitare fino a quando la brioche arriverà fino al bordo (ci vorranno circa 2-3 ore). Spennellate la superficie con il tuorlo sbattuto con un po’ di latte.","Infornate l’impasto in forno, preriscaldato a 180 °C, inserendo lo stampo nella parte bassa del forno. Cuocete per 30-40 minuti circa, coprendo la superficie con un foglio di alluminio a metà cottura.","Sfornate il vostro shokupan pane al latte giapponese e gustatelo!"]}]},{"id":"36-gelato-alla-frutta","num":36,"title":"Gelato alla frutta","subtitle":"con preparato Beppiani","cat":"dolci","emoji":"🍓","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":300,"u":"g","n":"fragole","di":true},{"q":280,"u":"g","n":"acqua tiepida","di":true},{"q":200,"u":"g","n":"preparato","di":true}]}],"steps":[{"title":null,"items":["Mettere gli ingredienti in una ciotola e frullare bene, mettere tutto nella gelatiera e far mantecare per circa 1 ora, fino a quando è ben compatto. Spostare in un contenitore e mettere in freezer per circa 2 ore."]}]},{"id":"37-gelato-al-limone","num":37,"title":"Gelato al limone","subtitle":null,"cat":"dolci","emoji":"🍋","servings":4,"servingsLabel":"persone","servingsGuess":true,"intro":null,"note":null,"link":null,"tips":[],"ingredients":[{"title":null,"items":[{"q":3,"n":"limoni"},{"q":250,"u":"g","n":"panna","di":true},{"q":200,"u":"g","n":"latte intero","di":true,"note":"oppure 180 g di latte condensato"},{"q":160,"u":"g","n":"zucchero a velo vanigliato","di":true}]}],"steps":[{"title":null,"items":["Pulire i limoni e grattare la buccia di un paio, poi spremerli e mettere il succo in una ciotola, aggiungere il latte e lo zucchero (se non vanigliato mettere qualche goccia di estratto). Frullare bene, poi aggiungere la panna e la buccia grattugiata del limone e frullare ancora.","Mettere in frigo per un quarto d’ora, poi spostare nella gelatiera e mantecare per circa un’ora. Quando è ben compatto spostare in un contenitore e mettere nel freezer per almeno un paio d’ore."]}]}]};

const configured = !!(firebaseConfig && firebaseConfig.projectId && !/^YOUR_/i.test(firebaseConfig.projectId));
const LS_KEY = 'ricettario.v2';

// Archivio locale: ricette originali + modifiche salvate nel browser.
const localStore = {
  mode: 'locale', needsLogin: false,
  merge(base) {
    const o = lsGet(LS_KEY, {}), del = new Set(o.deleted || []), mine = o.recipes || {};
    const out = base.filter((r) => !del.has(r.id)).map((r) => mine[r.id] || r);
    for (const r of Object.values(mine)) if (!out.some((x) => x.id === r.id)) out.push(r);
    return out;
  },
  async save(r) { const o = lsGet(LS_KEY, {}); o.recipes = { ...(o.recipes || {}), [r.id]: r }; o.deleted = (o.deleted || []).filter((i) => i !== r.id); lsSet(LS_KEY, o); },
  async remove(id) { const o = lsGet(LS_KEY, {}); if (o.recipes) delete o.recipes[id]; o.deleted = [...new Set([...(o.deleted || []), id])]; lsSet(LS_KEY, o); },
  async reset() { try { localStorage.removeItem(LS_KEY); } catch { /* ignora */ } },
};
let store = localStore;

// Archivio Firestore: lettura pubblica, scrittura dopo accesso con Google (vedi firestore.rules).
async function makeFirestoreStore() {
  const V = '10.14.1', B = `https://www.gstatic.com/firebasejs/${V}`;
  const [{ initializeApp }, fs, au] = await Promise.all([import(`${B}/firebase-app.js`), import(`${B}/firebase-firestore.js`), import(`${B}/firebase-auth.js`)]);
  const app = initializeApp(firebaseConfig);
  const db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  const auth = au.getAuth(app);
  au.onAuthStateChanged(auth, (u) => { state.user = u; if (!document.body.classList.contains('bare')) route(); });
  const clean = (r) => JSON.parse(JSON.stringify(r));
  return {
    mode: 'Firestore', needsLogin: true,
    async load() {
      const [rs, meta] = await Promise.all([fs.getDocs(fs.collection(db, 'recipes')), fs.getDoc(fs.doc(db, 'meta', 'categories'))]);
      return { recipes: rs.docs.map((d) => d.data()), categories: meta.exists() ? meta.data().list : null };
    },
    async signIn() { await au.signInWithPopup(auth, new au.GoogleAuthProvider()); },
    async signOut() { await au.signOut(auth); },
    async save(r) { await fs.setDoc(fs.doc(db, 'recipes', r.id), clean(r)); },
    async remove(id) { await fs.deleteDoc(fs.doc(db, 'recipes', id)); },
  };
}

function finalize(list) {
  state.recipes = [...list].sort((a, b) => (a.num ?? 9999) - (b.num ?? 9999));
  state.recipes.forEach((r, i) => { r.pos = i + 1; });
}

async function loadData() {
  const base = await loadBase();
  state.cats = base.categories;
  state.source = 'ricettario originale';
  if (configured) {
    try {
      const fsStore = await Promise.race([makeFirestoreStore(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
      const data = await Promise.race([fsStore.load(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
      if (!data.recipes.length) throw new Error('collezione vuota');
      store = fsStore; state.source = 'Firestore'; state.cats = data.categories || base.categories;
      finalize(data.recipes); return;
    } catch (e) { console.warn('Firestore non disponibile, uso i dati locali:', e); }
  }
  state.source = 'salvato su questo dispositivo';
  finalize(localStore.merge(base.recipes));
}

/* ---------------- quantità: formattazione e scalatura ---------------- */
const FR = [[0, ''], [0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾'], [1, '']];
function fmtNum(v) {
  const whole = Math.floor(v + 1e-9), frac = v - whole;
  let best = FR[0], d = 9;
  for (const f of FR) { const x = Math.abs(frac - f[0]); if (x < d) { d = x; best = f; } }
  if (d < 0.05) { const w = best[0] === 1 ? whole + 1 : whole; return best[1] ? (w ? `${w}${best[1]}` : best[1]) : String(w); }
  return String(Math.round(v * 10) / 10).replace('.', ',');
}
const METRIC = new Set(['g', 'kg', 'ml', 'l', 'dl']);
function fmtMetric(v, u) {
  if (u === 'g' && v >= 1000) { u = 'kg'; v /= 1000; } else if (u === 'kg' && v < 1) { u = 'g'; v *= 1000; }
  else if (u === 'ml' && v >= 1000) { u = 'l'; v /= 1000; } else if (u === 'l' && v < 1) { u = 'ml'; v *= 1000; }
  let s;
  if (u === 'kg' || u === 'l') s = String(Math.round(v * 100) / 100).replace('.', ',');
  else if (v >= 100) s = String(Math.round(v / 5) * 5);
  else if (v >= 10) s = String(Math.round(v));
  else s = String(Math.round(v * 10) / 10).replace('.', ',');
  return `${s} ${u}`;
}
const PLURAL = { cucchiaio: 'cucchiai', cucchiaino: 'cucchiaini', tazza: 'tazze', tazzina: 'tazzine', bicchiere: 'bicchieri', bicchierino: 'bicchierini', bustina: 'bustine', busta: 'buste', spicchio: 'spicchi', rotolo: 'rotoli', sacchetto: 'sacchetti', noce: 'noci', sorso: 'sorsi', pezzetto: 'pezzetti', stecca: 'stecche', ciuffo: 'ciuffi' };
const SINGULAR = Object.fromEntries(Object.entries(PLURAL).map(([a, b]) => [b, a]));
const pluralUnit = (u, v) => (v > 1.001 ? PLURAL[u] || u : SINGULAR[u] || u);
function qtyText(i, ratio) {
  if (i.q == null) return '';
  const one = (q) => (i.u && METRIC.has(i.u) ? fmtMetric(q * ratio, i.u) : `${fmtNum(q * ratio)}${i.u ? ' ' + pluralUnit(i.u, q * ratio) : ''}`);
  return i.q2 != null ? `${one(i.q).replace(/ [a-z]+$/i, '')}–${one(i.q2)}` : one(i.q);
}
const LABELS = { persone: ['persona', 'persone'], dose: ['dose', 'dosi'], porzioni: ['porzione', 'porzioni'], pagnotta: ['pagnotta', 'pagnotte'] };
const labelFor = (r, n) => (LABELS[r.servingsLabel] || [r.servingsLabel, r.servingsLabel])[n === 1 ? 0 : 1];

/* ---------------- testo <-> ricetta (editor) ---------------- */
const UNITS = { kg: 'kg', g: 'g', gr: 'g', ml: 'ml', l: 'l', lt: 'l', dl: 'dl', cucchiaio: 'cucchiaio', cucchiai: 'cucchiai', cucchiaino: 'cucchiaino', cucchiaini: 'cucchiaini', tazza: 'tazza', tazze: 'tazze', tazzina: 'tazzina', tazzine: 'tazzine', bicchiere: 'bicchiere', bicchierino: 'bicchierino', bustina: 'bustina', bustine: 'bustine', busta: 'busta', spicchio: 'spicchio', spicchi: 'spicchi', rotolo: 'rotolo', sacchetto: 'sacchetto', noce: 'noce', sorso: 'sorso', pezzetto: 'pezzetto', stecca: 'stecca', ciuffo: 'ciuffo' };
const FRV = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
const NUM = '(?:\\d+\\s*[½¼¾⅓⅔]|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])';
const ING_RE = new RegExp(`^(${NUM})(?:\\s+o\\s+(${NUM}))?\\s+(.*)$`);
const toNum = (t) => { t = t.trim(); const m = t.match(/^(\d+)\s*([½¼¾⅓⅔])$/); if (m) return +m[1] + FRV[m[2]]; return FRV[t] ?? parseFloat(t.replace(',', '.')); };
function parseIngredient(line) {
  let [main, ...noteParts] = line.split('|');
  const note = noteParts.join('|').trim(); main = main.trim();
  const m = main.match(ING_RE);
  if (!m) return { n: main, ...(note ? { note } : {}) };
  let rest = m[3], u = null;
  const w = rest.match(/^([A-Za-zàèéìòù]+)\.?\s+(.*)$/);
  if (w && UNITS[w[1].toLowerCase()]) { u = UNITS[w[1].toLowerCase()]; rest = w[2]; }
  const out = { q: toNum(m[1]) };
  if (m[2]) out.q2 = toNum(m[2]);
  if (u) out.u = u;
  out.n = rest.trim();
  if (note) out.note = note;
  return out;
}
function ingToLine(i) {
  let s = '';
  if (i.q != null) { s += fmtNum(i.q); if (i.q2 != null) s += ` o ${fmtNum(i.q2)}`; s += ' '; if (i.u) s += `${i.u} `; }
  s += i.n; if (i.note) s += `|${i.note}`;
  return s.trim();
}
function groupsToText(groups, kind) {
  return groups.map((g) => `${g.title ? `## ${g.title}\n` : ''}${g.items.map((it) => (kind === 'ing' ? ingToLine(it) : it)).join(kind === 'ing' ? '\n' : '\n\n')}`).join('\n\n');
}
function textToGroups(text, kind) {
  const groups = []; let cur = null, buf = [];
  const flush = () => { if (buf.length && cur) cur.items.push(kind === 'ing' ? parseIngredient(buf[0]) : buf.join(' ')); buf = []; };
  const open = (title) => { flush(); cur = { title, items: [] }; groups.push(cur); };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (line.startsWith('## ')) { open(line.slice(3).trim() || null); continue; }
    if (!cur) open(null);
    if (!line) { flush(); continue; }
    if (kind === 'ing') { buf = [line]; flush(); } else buf.push(line);
  }
  flush();
  return groups.filter((g) => g.items.length);
}
const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ricetta';

/* ---------------- ricerca ---------------- */
function filtered(all = false) {
  const q = norm(state.q).trim();
  const list = state.recipes.filter((r) => all || state.cat === 'all' || r.cat === state.cat);
  if (!q) return list;
  const words = q.split(/\s+/);
  return list.map((r) => {
    const title = norm(`${r.title} ${r.subtitle || ''}`);
    const ings = norm(r.ingredients.flatMap((g) => g.items.map((i) => i.n)).join(' '));
    const rest = norm(`${catOf(r.cat).name} ${r.steps.flatMap((g) => g.items).join(' ')}`);
    let score = 0;
    for (const w of words) { if (title.includes(w)) score += 10; else if (ings.includes(w)) score += 4; else if (rest.includes(w)) score += 1; else return null; }
    return { r, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.r.pos - b.r.pos).map((x) => x.r);
}
